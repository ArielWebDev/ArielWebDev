<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="6" viewBox="0 0 1000 6" fill="none" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8A2BE2" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="2" width="1000" height="2" rx="1" fill="url(#line)"/>
  <rect x="-200" y="2" width="200" height="2" rx="1" fill="url(#glint)">
    <animate attributeName="x" from="-200" to="1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
