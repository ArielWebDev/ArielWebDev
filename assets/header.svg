<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-label="Ariel Alfath — Fullstack Developer">
  <title>Ariel Alfath — Fullstack Developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#11151f"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="60%" stop-color="#cfe9f5"/>
      <stop offset="100%" stop-color="#7fe3ff"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2dd4ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="260" rx="16"/>
    </clipPath>

    <!-- typing reveal -->
    <clipPath id="typeName">
      <rect x="56" y="80" width="0" height="72">
        <animate attributeName="width"
                 values="0;0;446;446;0;0"
                 keyTimes="0;0.05;0.34;0.88;0.96;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- drifting ambient light -->
    <ellipse cx="180" cy="70" rx="260" ry="180" fill="url(#orbA)">
      <animate attributeName="cx" values="180;340;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;125;70"  dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="860" cy="200" rx="280" ry="190" fill="url(#orbB)">
      <animate attributeName="cx" values="860;700;860" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;140;200" dur="13s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="0" y="0" width="1000" height="3" fill="url(#accent)"/>

    <!-- prompt -->
    <text x="60" y="62" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#8b949e">$ whoami</text>

    <!-- name, revealed like typing -->
    <g clip-path="url(#typeName)">
      <text x="56" y="134" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="1.5" fill="url(#nameFill)">ARIEL ALFATH</text>
    </g>

    <!-- caret that follows the typing -->
    <rect y="86" width="12" height="60" fill="#06B6D4">
      <animate attributeName="x"
               values="58;58;504;504;58;58"
               keyTimes="0;0.05;0.34;0.88;0.96;1"
               dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;1;0;0;1;1"
               keyTimes="0;0.49;0.5;0.99;1;1"
               dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- growing underline -->
    <rect x="58" y="152" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width"
               values="0;0;446;446;0;0"
               keyTimes="0;0.08;0.37;0.88;0.96;1"
               dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- role line -->
    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="600">
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.37;0.44;0.88;0.93;1"
               dur="9s" repeatCount="indefinite"/>
      <text x="58" y="192" fill="#06B6D4">Fullstack Developer</text>
      <text x="271" y="192" fill="#8b949e">·</text>
      <text x="290" y="192" fill="#8A2BE2">AI</text>
      <text x="322" y="192" fill="#8b949e">·</text>
      <text x="341" y="192" fill="#4F46E5">Blockchain</text>
    </g>

    <!-- footer meta -->
    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#8b949e">
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.45;0.52;0.88;0.93;1"
               dur="9s" repeatCount="indefinite"/>
      <text x="60" y="226">Samarinda, Indonesia</text>
      <text x="230" y="226" fill="#30363d">|</text>
      <text x="252" y="226">Code · Collaborate · Conquer Challenges</text>
    </g>

    <rect x="0" y="257" width="1000" height="3" fill="url(#accent)" opacity="0.65"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="259" rx="16" fill="none" stroke="#30363d" stroke-opacity="0.7"/>
</svg>
