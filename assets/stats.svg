<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="GitHub statistics">
  <title>GitHub statistics for ArielWebDev</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .stat-num   { font: 700 30px 'Segoe UI', Inter, system-ui, sans-serif; }
    .stat-label { font: 500 12.5px 'JetBrains Mono', ui-monospace, monospace; fill: #8b949e; letter-spacing: .3px; }
    .heading    { font: 600 14px 'JetBrains Mono', ui-monospace, monospace; fill: #8b949e; letter-spacing: 1.6px; }
    .lang-name  { font: 600 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #e6edf3; }
    .lang-pct   { font: 500 12px 'JetBrains Mono', ui-monospace, monospace; fill: #8b949e; }
    .foot       { font: 500 11px 'JetBrains Mono', ui-monospace, monospace; fill: #8b949e; }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0D1117"/>
    <ellipse cx="820" cy="60" rx="300" ry="200" fill="url(#glow)"/>
    <rect width="1000" height="3" fill="url(#accent)"/>

    <text x="64" y="62" class="heading">GITHUB STATS</text>
    <text x="640" y="62" class="heading">TOP LANGUAGES</text>

    
    <g class="rise" style="animation-delay:0.08s">
      <text x="64" y="118" class="stat-num" fill="#06B6D4">291</text>
      <text x="64" y="140" class="stat-label">Contributions (1y)</text>
    </g>
    <g class="rise" style="animation-delay:0.15000000000000002s">
      <text x="290" y="118" class="stat-num" fill="#8A2BE2">265</text>
      <text x="290" y="140" class="stat-label">Commits</text>
    </g>
    <g class="rise" style="animation-delay:0.22000000000000003s">
      <text x="452" y="118" class="stat-num" fill="#4F46E5">20</text>
      <text x="452" y="140" class="stat-label">Pull Requests</text>
    </g>
    <g class="rise" style="animation-delay:0.29000000000000004s">
      <text x="64" y="205" class="stat-num" fill="#8A2BE2">26</text>
      <text x="64" y="227" class="stat-label">Repositories</text>
    </g>
    <g class="rise" style="animation-delay:0.36000000000000004s">
      <text x="290" y="205" class="stat-num" fill="#06B6D4">2</text>
      <text x="290" y="227" class="stat-label">Stars Earned</text>
    </g>
    <g class="rise" style="animation-delay:0.43000000000000005s">
      <text x="452" y="205" class="stat-num" fill="#4F46E5">9</text>
      <text x="452" y="227" class="stat-label">Followers</text>
    </g>

    <line x1="600" y1="44" x2="600" y2="256" stroke="#30363d" stroke-opacity="0.6"/>

    
    <g class="rise" style="animation-delay:0.5s">
      <text x="640" y="96" class="lang-name">JavaScript</text>
      <text x="890" y="96" class="lang-pct" text-anchor="end">36.7%</text>
      <rect x="640" y="104" width="250" height="7" rx="3.5" fill="#21262d"/>
      <rect x="640" y="104" width="91.76408266777518" height="7" rx="3.5" fill="#f1e05a">
        <animate attributeName="width" from="0" to="91.76408266777518" dur="1.1s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.3 1" begin="0.5s"/>
      </rect>
    </g>
    <g class="rise" style="animation-delay:0.58s">
      <text x="640" y="130" class="lang-name">CSS</text>
      <text x="890" y="130" class="lang-pct" text-anchor="end">26.2%</text>
      <rect x="640" y="138" width="250" height="7" rx="3.5" fill="#21262d"/>
      <rect x="640" y="138" width="65.62009164251326" height="7" rx="3.5" fill="#663399">
        <animate attributeName="width" from="0" to="65.62009164251326" dur="1.1s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.3 1" begin="0.58s"/>
      </rect>
    </g>
    <g class="rise" style="animation-delay:0.66s">
      <text x="640" y="164" class="lang-name">TypeScript</text>
      <text x="890" y="164" class="lang-pct" text-anchor="end">11.4%</text>
      <rect x="640" y="172" width="250" height="7" rx="3.5" fill="#21262d"/>
      <rect x="640" y="172" width="28.51557794160992" height="7" rx="3.5" fill="#3178c6">
        <animate attributeName="width" from="0" to="28.51557794160992" dur="1.1s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.3 1" begin="0.66s"/>
      </rect>
    </g>
    <g class="rise" style="animation-delay:0.74s">
      <text x="640" y="198" class="lang-name">PHP</text>
      <text x="890" y="198" class="lang-pct" text-anchor="end">10.0%</text>
      <rect x="640" y="206" width="250" height="7" rx="3.5" fill="#21262d"/>
      <rect x="640" y="206" width="24.927954013990647" height="7" rx="3.5" fill="#4F5D95">
        <animate attributeName="width" from="0" to="24.927954013990647" dur="1.1s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.3 1" begin="0.74s"/>
      </rect>
    </g>
    <g class="rise" style="animation-delay:0.8200000000000001s">
      <text x="640" y="232" class="lang-name">HTML</text>
      <text x="890" y="232" class="lang-pct" text-anchor="end">6.8%</text>
      <rect x="640" y="240" width="250" height="7" rx="3.5" fill="#21262d"/>
      <rect x="640" y="240" width="17.113303687365992" height="7" rx="3.5" fill="#e34c26">
        <animate attributeName="width" from="0" to="17.113303687365992" dur="1.1s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.3 1" begin="0.8200000000000001s"/>
      </rect>
    </g>
    <g class="rise" style="animation-delay:0.9s">
      <text x="640" y="266" class="lang-name">Python</text>
      <text x="890" y="266" class="lang-pct" text-anchor="end">3.8%</text>
      <rect x="640" y="274" width="250" height="7" rx="3.5" fill="#21262d"/>
      <rect x="640" y="274" width="9.466739234052199" height="7" rx="3.5" fill="#3572A5">
        <animate attributeName="width" from="0" to="9.466739234052199" dur="1.1s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.3 1" begin="0.9s"/>
      </rect>
    </g>

    <text x="64" y="272" class="foot">private repositories included · updated 2026-09-12</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#30363d" stroke-opacity="0.7"/>
</svg>
