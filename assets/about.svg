<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none" role="img" aria-label="About Ariel — student and assistant at UMKT, powered by coffee">
  <title>About Ariel — UMKT student, teaching &amp; lab assistant, powered by coffee</title>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#aab4c0"/>
    </linearGradient>


    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2dd4ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect width="1000" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    .kicker { font: 600 13px 'JetBrains Mono', ui-monospace, monospace; fill: #8b949e; letter-spacing: 1.8px; }
    .label  { font: 500 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #8b949e; letter-spacing: 1.1px; }
    .value  { font: 600 17px 'Segoe UI', Inter, system-ui, sans-serif; fill: #e6edf3; }
    .accentv{ fill: #06B6D4; }
    .row    { animation: rise .75s cubic-bezier(.2,.7,.3,1) both; }
    .r1 { animation-delay:.10s } .r2 { animation-delay:.24s } .r3 { animation-delay:.38s } .r4 { animation-delay:.52s }
    @keyframes rise { from { opacity:0; transform: translateY(12px) } to { opacity:1; transform:none } }

    .steam { animation: steam 3.2s ease-in-out infinite; transform-origin: center; }
    .s2 { animation-delay: .5s } .s3 { animation-delay: 1s }
    @keyframes steam {
      0%   { opacity: 0; transform: translateY(6px)  scaleX(.85) }
      28%  { opacity: .75 }
      70%  { opacity: .25; transform: translateY(-16px) scaleX(1.1) }
      100% { opacity: 0; transform: translateY(-26px) scaleX(1.2) }
    }

    .float { animation: float 5.5s ease-in-out infinite; transform-origin: center; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="#0D1117"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <ellipse cx="810" cy="150" rx="260" ry="200" fill="url(#glow)"/>
    <rect width="1000" height="3" fill="url(#accent)"/>

    <text x="56" y="58" class="kicker">// ABOUT</text>

    <!-- fact rows -->
    <g class="row r1">
      <!-- graduation cap -->
      <g stroke="#8A2BE2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(56,88)">
        <path d="M2 7.5L13 2l11 5.5L13 13 2 7.5z"/>
        <path d="M6.5 9.8V16c0 1.9 2.9 3.4 6.5 3.4s6.5-1.5 6.5-3.4V9.8"/>
        <path d="M24 7.5v6.4"/>
      </g>
      <text x="98" y="94" class="label">EDUCATION</text>
      <text x="98" y="114" class="value">Universitas Muhammadiyah Kalimantan Timur</text>
    </g>

    <g class="row r2">
      <!-- teaching board -->
      <g stroke="#4F46E5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(56,148)">
        <rect x="2" y="2" width="22" height="15" rx="2.2"/>
        <path d="M7 7h9M7 11h6"/>
        <path d="M13 17v4M9.5 23.5L13 21l3.5 2.5"/>
      </g>
      <text x="98" y="154" class="label">WORK</text>
      <text x="98" y="174" class="value">Teaching Assistant &amp; Lab Assistant <tspan class="accentv">@ UMKT</tspan></text>
    </g>

    <g class="row r3">
      <!-- flask -->
      <g stroke="#06B6D4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(56,208)">
        <path d="M10 2v7.4L3.4 20.2A2.4 2.4 0 005.5 24h15a2.4 2.4 0 002.1-3.8L16 9.4V2"/>
        <path d="M8.4 2h9.2"/>
        <path d="M6.6 16.4h12.8"/>
      </g>
      <text x="98" y="214" class="label">CURRENTLY</text>
      <text x="98" y="234" class="value">Fullstack dev · AHP with Python · Blockchain &amp; IoT</text>
    </g>

    <g class="row r4">
      <!-- bowl -->
      <g stroke="#8A2BE2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(56,268)">
        <path d="M2.5 9.5h21a10.5 10.5 0 01-21 0z"/>
        <path d="M2 22h22"/>
        <path d="M9 5.6c0-1.6 1.4-1.9 1.4-3.4M13 5.6c0-1.6 1.4-1.9 1.4-3.4"/>
      </g>
      <text x="98" y="274" class="label">FUELED BY</text>
      <text x="98" y="294" class="value">Coffee · Nasi goreng · KFC</text>
    </g>

    <!-- coffee illustration -->
    <g class="float" transform="translate(770, 92)">
      <!-- steam -->
      <g fill="none" stroke="#c9d1d9" stroke-width="3.4" stroke-linecap="round" opacity="0.8">
        <path class="steam"    d="M28 34c-7-8 7-14 0-22"/>
        <path class="steam s2" d="M56 34c-7-8 7-14 0-22"/>
        <path class="steam s3" d="M84 34c-7-8 7-14 0-22"/>
      </g>

      <!-- saucer -->
      <ellipse cx="56" cy="152" rx="74" ry="12" fill="#161b22"/>
      <ellipse cx="56" cy="149" rx="74" ry="12" fill="#21262d"/>

      <!-- handle -->
      <path d="M108 78c22 0 22 30 0 30" fill="none" stroke="url(#cup)" stroke-width="9" stroke-linecap="round"/>

      <!-- cup body -->
      <path d="M6 52h104v34c0 30-23 54-52 54S6 116 6 86V52z" fill="url(#cup)"/>
      <!-- coffee surface -->
      <ellipse cx="58" cy="53" rx="52" ry="11" fill="#4a2c17"/>
      <ellipse cx="58" cy="52" rx="46" ry="8.6" fill="#7c4a24">
        <animate attributeName="ry" values="8.6;7.6;8.6" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- highlight -->
      <path d="M20 62v24c0 20 12 34 26 39" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    </g>

    <rect x="0" y="317" width="1000" height="3" fill="url(#accent)" opacity="0.6"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="319" rx="16" fill="none" stroke="#30363d" stroke-opacity="0.7"/>
</svg>
