<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none" role="img" aria-label="About Ariel — UMKT student, teaching and lab assistant">
  <title>ariel@umkt — about</title>

  <defs>
    <clipPath id="win"><rect width="1000" height="330" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <!-- window body -->
    <rect width="1000" height="330" fill="#0b0f16"/>

    <!-- title bar -->
    <rect width="1000" height="44" fill="#161b22"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#30363d"/>
    <circle cx="26" cy="22" r="6.5" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="6.5" fill="#febc2e"/>
    <circle cx="70" cy="22" r="6.5" fill="#28c840"/>
    <text x="500" y="27" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#8b949e">ariel@umkt: ~/about</text>

    <!-- ══════ line 1: prompt ══════ -->
    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.038;0.055;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="88" fill="#06B6D4">$</text>
      <text x="60" y="88" fill="#e6edf3">whoami</text>
    </g>

    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.088;0.105;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="114" fill="#8b949e">Nazriel Rahman Al'Fath <tspan fill="#4F46E5">—</tspan> <tspan fill="#e6edf3">"Ariel"</tspan>, fullstack developer</text>
    </g>

    <!-- ══════ line 2: campus ══════ -->
    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.163;0.18;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="152" fill="#06B6D4">$</text>
      <text x="60" y="152" fill="#e6edf3">cat campus.txt</text>
    </g>

    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.213;0.23;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="178" fill="#8b949e">Universitas Muhammadiyah Kalimantan Timur</text>
    </g>

    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.267;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="204" fill="#8b949e">role: <tspan fill="#8A2BE2">Teaching Assistant</tspan> · <tspan fill="#8A2BE2">Lab Assistant</tspan></text>
    </g>

    <!-- ══════ line 3: fuel ══════ -->
    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.342;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="242" fill="#06B6D4">$</text>
      <text x="60" y="242" fill="#e6edf3">cat fuel.txt</text>
    </g>

    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.392;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="268" fill="#8b949e">coffee <tspan fill="#30363d">·</tspan> nasi goreng <tspan fill="#30363d">·</tspan> KFC</text>
    </g>

    <!-- ══════ trailing prompt + caret ══════ -->
    <g opacity="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4375;0.45;0.93;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text x="40" y="306" fill="#06B6D4">$</text>
      <rect x="60" y="294" width="9" height="17" fill="#06B6D4">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>

  <rect x="0.5" y="0.5" width="999" height="329" rx="12" fill="none" stroke="#30363d"/>
</svg>
