name: Generate Stats Card

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-*.mjs"
      - ".github/workflows/stats.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats.svg
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Generate commit-langs.svg
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LOGIN: ${{ github.repository_owner }}
          DAYS: "30"
        run: node scripts/generate-commit-langs.mjs

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/commit-langs.svg
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: update stats cards"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "could not push after 5 attempts" && exit 1
